<!DOCTYPE html>
<html>
<head>
  <title>Amber's Portfolio</title>
  <style>
    body {
      font-family: "Lucida Console", monospace;
      max-width: 900px;
      margin: 60px auto;
      padding: 0 24px;
      background: linear-gradient(to bottom right, #fff0f6, #f3e8ff);
      color: #4b4453;
    }

    h1 {
      font-size: 42px;
      color: #9d4edd;
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 40px;
      color: #c77dff;
    }

    .projects {
      display: grid;
      gap: 18px;
      margin-top: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.8);
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(157, 78, 221, 0.15);
      transition: transform 0.2s ease;
    }

    .card a {
      font-size: 18px;
      font-weight: bold;
      color: #2563eb;
      text-decoration: none;
    }

    .card:hover {
      transform: translateY(-4px);
    }

  .card a {
      font-size: 20px;
      font-weight: bold;
      color: #b5179e;
      text-decoration: none;
    }

    .card a:hover {
      color: #7209b7;
    }
  </style>
</head>

<body>
  <h1>Welcome to my portfolio</h1>
  <p>Hi, I’m Amber. I’m interested in business analytics, supply chain analytics and data-driven decision making.</p>

  <h2>Projects</h2>

  <div class="projects">
    <div class="card"><a href="/pink-tax-analysis/">Pink Tax Analysis</a></div>
    <div class="card"><a href="/readmission-risk-modeling/">Readmission Risk Modeling</a></div>
    <div class="card"><a href="/game-price-prediction-and-analysis/">Game Price Prediction and Analysis</a></div>
    <div class="card"><a href="/beauty-product-rating-predictor/">Beauty Product Rating Predictor</a></div>
    <div class="card"><a href="/classification-of-news-headline/">Classification of News Headline</a></div>
  </div>
</body>
</html>
